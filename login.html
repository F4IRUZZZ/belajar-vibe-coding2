<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Catatan Keuangan Keluarga</title>
  <meta name="description" content="Masuk akun keuangan pribadi atau keluarga">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:,">
  <script src="js/auth.js" defer></script>
  <script src="js/format.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body class="center-screen">
  <main class="card">
    <h1>Login</h1>
    <form id="form-login">
      <div class="field">
        <label for="email">Email:</label>
        <input type="email" id="email" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password:</label>
        <div class="password-wrap">
          <input type="password" id="password" autocomplete="current-password">
          <button type="button" id="lihat-password" class="btn-ikon" aria-label="Tampilkan password"></button>
        </div>
      </div>
      <button type="submit" id="btn-login" class="btn">Masuk</button>
    </form>
    <p id="hasil-login"></p>
    <p><a href="register.html">Belum punya akun? Daftar</a></p>
  </main>
</body>
</html>
