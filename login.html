<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Catatan Keuangan Keluarga</title>
  <meta name="description" content="Masuk atau daftar akun keuangan pribadi atau keluarga">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Login</h1>
    <form id="form-login">
      <label for="email">Email:</label>
      <input type="email" id="email"><br><br>
      <label for="password">Password:</label>
      <input type="password" id="password"><br><br>
      <button type="submit" id="btn-login" class="btn">Masuk</button>
    </form>
    <p id="hasil-login"></p>
    <p><a href="index.html">Ke Dashboard</a></p>
  </main>

  <main class="card">
    <h2>Daftar Akun Baru</h2>
    <form id="form-register">
      <label for="reg-email">Email:</label>
      <input type="email" id="reg-email"><br><br>
      <label for="reg-password">Password (min 4):</label>
      <input type="password" id="reg-password"><br><br>
      <label for="reg-role">Akun untuk:</label>
      <select id="reg-role">
        <option value="pribadi">Pribadi (data sendiri)</option>
        <option value="keluarga">Keluarga (1 email dipakai bersama)</option>
      </select><br><br>
      <button type="submit" id="btn-register" class="btn">Daftar</button>
    </form>
    <p id="hasil-register"></p>
  </main>
</body>
</html>
