<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produk - Catatan Keuangan Keluarga</title>
  <meta name="description" content="Kelola daftar kebutuhan dan barang rumah">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:,">
  <script src="js/auth.js" defer></script>
  <script src="js/keuangan.js" defer></script>
  <script src="js/format.js" defer></script>
  <script src="js/produk.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Produk</h1>
    <p id="info-user">Loading...</p>
    <hr>
    <h2>Tambah Produk</h2>
    <form id="form-produk">
      <div class="field">
        <label for="nama-produk">Nama:</label>
        <input type="text" id="nama-produk" placeholder="contoh: Beras">
      </div>
      <div class="field">
        <label for="dropdown-tombol">Kategori (pilih atau ketik baru):</label>
        <div class="dropdown" id="dropdown-kategori">
          <button type="button" id="dropdown-tombol">Pilih kategori ▾</button>
          <div class="dropdown-list" id="dropdown-list" hidden>
            <input type="text" id="dropdown-cari" placeholder="Cari / ketik baru..." aria-label="Cari kategori">
            <div id="dropdown-opsi"></div>
          </div>
        </div>
        <input type="hidden" id="kategori-produk" value="">
      </div>
      <button type="submit" id="btn-tambah-produk" class="btn">Tambah</button>
    </form>
    <p id="hasil"></p>
    <hr>
    <h2>Daftar</h2>
    <ul id="list-produk"></ul>
    <p class="nav-sticky"><a href="index.html">Dashboard</a> | <a href="transaksi.html">Transaksi</a> | <a href="produk.html">Produk</a> | <a href="hutang.html">Hutang</a> | <a href="profile.html">Profile</a> | <button type="button" class="btn-tema btn-ikon" aria-label="Ganti tema">Gelap</button></p>
  </main>
</body>
</html>
