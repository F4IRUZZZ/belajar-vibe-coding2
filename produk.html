<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produk - Catatan Keuangan Keluarga</title>
  <meta name="description" content="Kelola daftar kebutuhan dan barang rumah">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js" defer></script>
  <script src="js/keuangan.js" defer></script>
  <script src="js/produk.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Produk</h1>
    <p id="info-user">Loading...</p>
    <hr>
    <h2>Tambah Produk</h2>
    <form id="form-produk">
      <label for="nama-produk">Nama:</label>
      <input type="text" id="nama-produk" placeholder="contoh: Beras"><br><br>
      <label id="label-kategori">Kategori (pilih atau ketik baru):</label>
      <div class="dropdown" id="dropdown-kategori">
        <button type="button" id="dropdown-tombol">Pilih kategori ▾</button>
        <div class="dropdown-list" id="dropdown-list" hidden>
          <input type="text" id="dropdown-cari" placeholder="Cari / ketik baru...">
          <div id="dropdown-opsi"></div>
        </div>
      </div>
      <input type="hidden" id="kategori-produk" value=""><br><br>
      <button type="submit" id="btn-tambah-produk" class="btn">Tambah</button>
    </form>
    <p id="hasil"></p>
    <hr>
    <h2>Daftar</h2>
    <ul id="list-produk"></ul>
    <p><a href="index.html">Ke Dashboard</a> | <a href="transaksi.html">Catat Transaksi</a></p>
  </main>
</body>
</html>
