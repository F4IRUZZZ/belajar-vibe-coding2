<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaksi - Catatan Keuangan Keluarga</title>
  <meta name="description" content="Catat, ubah, dan hapus transaksi masuk dan keluar">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:,">
  <script src="js/api.js" defer></script>
  <script src="js/keuangan.js" defer></script>
  <script src="js/format.js" defer></script>
  <script src="js/transaksi.js" defer></script>
</head>
<body class="app">
  <aside class="sidebar">
    <p class="sidebar-brand">Keuangan</p>
    <nav class="sidebar-nav">
      <a href="index.html" data-ikon="dashboard">Dashboard</a>
      <a href="transaksi.html" data-ikon="transaksi" class="nav-aktif">Transaksi</a>
      <a href="produk.html" data-ikon="produk">Produk</a>
      <a href="hutang.html" data-ikon="hutang">Hutang</a>
      <a href="profile.html" data-ikon="profile">Profile</a>
    </nav>
  </aside>
  <main class="card">
    <h1>Transaksi</h1>
    <p id="info-user">Loading...</p>
    <hr>
    <h2>Catat Transaksi</h2>
    <form id="form-transaksi">
      <div class="field">
        <label for="jenis">Jenis:</label>
        <select id="jenis">
          <option value="masuk">Masuk (pendapatan)</option>
          <option value="keluar">Keluar (pengeluaran)</option>
        </select>
      </div>
      <div class="field">
        <label for="jumlah">Jumlah:</label>
        <div class="input-rp">
          <span>Rp</span>
          <input type="text" id="jumlah" inputmode="numeric" placeholder="contoh: 20000">
        </div>
      </div>
      <div class="field" id="field-untuk">
        <label for="untuk-produk">Untuk apa? (khusus pengeluaran)</label>
        <select id="untuk-produk"></select>
      </div>
      <div class="field" id="field-kategori-bebas" hidden>
        <label for="kategori-bebas">Tulis sendiri untuk apa:</label>
        <input type="text" id="kategori-bebas" placeholder="contoh: Parkir">
      </div>
      <div class="field">
        <label for="tanggal">Tanggal:</label>
        <input type="date" id="tanggal">
      </div>
      <div class="field">
        <label for="catatan-awal">Catatan (opsional, boleh kosong):</label>
        <input type="text" id="catatan-awal" placeholder="contoh: Gajian minggu ini">
      </div>
      <button type="submit" id="btn-tambah" class="btn">Catat</button>
    </form>
    <p id="hasil"></p>
    <hr>
    <h2>Daftar</h2>
    <div class="tab-bar" role="tablist" aria-label="Filter daftar transaksi">
      <button type="button" class="tab-riwayat tab-aktif" data-tab="semua" role="tab">Semua</button>
      <button type="button" class="tab-riwayat" data-tab="masuk" role="tab">Masuk</button>
      <button type="button" class="tab-riwayat" data-tab="keluar" role="tab">Keluar</button>
    </div>
    <div class="field">
      <label for="cari-riwayat">Cari (kategori/catatan/tanggal/nominal):</label>
      <input type="text" id="cari-riwayat" placeholder="contoh: makan / gaji / 2026-09-01">
    </div>
    <div id="bulk-bar" hidden>
      <span id="bulk-count"></span>
      <button type="button" id="btn-bulk-hapus" class="btn-danger">Hapus terpilih</button>
    </div>
    <div id="list-transaksi"></div>
  </main>
</body>
</html>
