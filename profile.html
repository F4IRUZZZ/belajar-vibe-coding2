<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengaturan - Catatan Keuangan Keluarga</title>
  <meta name="description" content="Pengaturan akun dan aplikasi">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
  <link rel="icon" href="data:,">
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/keuangan.js" defer></script>
  <script src="js/format.js" defer></script>
  <script src="js/profile.js" defer></script>
  <script src="js/pwa.js" defer></script>
</head>
<body class="app">
  <aside class="sidebar">
    <p class="sidebar-brand">Keuangan</p>
    <nav class="sidebar-nav">
      <a href="/" data-ikon="dashboard">Dashboard</a>
      <a href="transaksi" data-ikon="transaksi">Transaksi</a>
      <a href="produk" data-ikon="produk">Produk</a>
      <a href="hutang" data-ikon="hutang">Hutang</a>
      <a href="profile" data-ikon="profile" class="nav-aktif">Pengaturan</a>
    </nav>
  </aside>
  <main class="card">
    <h1>Pengaturan</h1>
    <p id="info">Loading...</p>
    <hr>
    <h2>Ubah Username <button type="button" id="btn-edit-username" class="btn-ikon" aria-label="Ubah username" title="Ubah username"></button></h2>
    <form id="form-username" hidden>
      <div class="field">
        <label for="username-baru">Username baru (min 3, unik):</label>
        <input type="text" id="username-baru" placeholder="contoh: Akun Keluarga">
      </div>
      <button type="submit" id="btn-username" class="btn">Simpan</button>
    </form>
    <p id="hasil-username"></p>
    <hr>
    <h2>Ekspor Data</h2>
    <p><button type="button" id="btn-unduh-profile">Ekspor CSV</button></p>
    <p id="hasil-unduh"></p>
    <hr>
    <h2>Tampilan</h2>
    <div class="field">
      <p class="label-teks">Tema aplikasi <span id="info-tema" class="tema-status"></span></p>
      <p><button type="button" class="btn-tema" id="btn-tema-profile">Gelap</button></p>
      <p><button type="button" id="btn-install" hidden>Install aplikasi</button></p>
      <p id="info-install" class="tema-status"></p>
    </div>
    <hr>
    <button id="btn-logout">Logout</button>
    <p id="hasil"></p>
  </main>
</body>
</html>
