<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Catatan Keuangan Keluarga</title>
  <meta name="description" content="Profil akun dan keluar">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:,">
  <script src="js/auth.js" defer></script>
  <script src="js/keuangan.js" defer></script>
  <script src="js/format.js" defer></script>
  <script src="js/profile.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Profile</h1>
    <p id="info">Loading...</p>
    <hr>
    <h2>Ubah Username <button type="button" id="btn-edit-username" class="btn-ikon" aria-label="Ubah username" title="Ubah username"></button></h2>
    <form id="form-username" hidden>
      <div class="field">
        <label for="username-baru">Username baru (min 3, unik):</label>
        <input type="text" id="username-baru" placeholder="contoh: Akun Keluarga">
      </div>
      <button type="submit" id="btn-username" class="btn">Simpan</button>
    </form>
    <p id="hasil-username"></p>
    <hr>
    <h2>Unduh Data</h2>
    <p><button type="button" id="btn-unduh-profile">Unduh CSV</button></p>
    <p id="hasil-unduh"></p>
    <hr>
    <h2>Tampilan</h2>
    <div class="field">
      <label>Tema aplikasi <span id="info-tema" class="tema-status"></span></label>
      <p><button type="button" class="btn-tema" id="btn-tema-profile">Gelap</button></p>
    </div>
    <hr>
    <button id="btn-logout">Logout</button>
    <p id="hasil"></p>
    <p class="nav-sticky"><a href="index.html">Dashboard</a><a href="transaksi.html">Transaksi</a><a href="produk.html">Produk</a><a href="hutang.html">Hutang</a><a href="profile.html" class="nav-aktif">Profile</a></p>
  </main>
</body>
</html>
