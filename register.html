<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - Catatan Keuangan Keluarga</title>
  <meta name="description" content="Daftar akun keuangan pribadi atau keluarga">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:,">
  <script src="js/auth.js" defer></script>
  <script src="js/format.js" defer></script>
  <script src="js/register.js" defer></script>
</head>
<body class="center-screen">
  <main class="card">
    <p><button type="button" class="btn-tema btn-ikon" aria-label="Ganti tema">Gelap</button></p>
    <h1>Daftar Akun Baru</h1>
    <form id="form-register">
      <div class="field">
        <label for="reg-email">Email:</label>
        <input type="email" id="reg-email" autocomplete="email">
      </div>
      <div class="field">
        <label for="reg-username">Username (min 3, unik):</label>
        <input type="text" id="reg-username" placeholder="contoh: Akun Keluarga">
      </div>
      <div class="field">
        <label for="reg-password">Password (min 8 + huruf + angka):</label>
        <div class="password-wrap">
          <input type="password" id="reg-password" autocomplete="new-password">
          <button type="button" id="lihat-reg-password" class="btn-ikon" aria-label="Tampilkan password"></button>
        </div>
        <p id="meter-password"></p>
      </div>
      <div class="field">
        <label for="reg-password2">Ulangi password (harus sama):</label>
        <div class="password-wrap">
          <input type="password" id="reg-password2" autocomplete="new-password">
          <button type="button" id="lihat-reg-password2" class="btn-ikon" aria-label="Tampilkan password"></button>
        </div>
        <p id="konfirmasi-cocok"></p>
      </div>
      <div class="field">
        <label for="reg-role">Akun untuk:</label>
        <select id="reg-role">
          <option value="pribadi">Pribadi (data sendiri)</option>
          <option value="keluarga">Keluarga (1 email dipakai bersama)</option>
        </select>
      </div>
      <button type="submit" id="btn-register" class="btn">Daftar</button>
    </form>
    <p id="hasil-register"></p>
    <p><a href="login.html">Sudah punya akun? Login</a></p>
  </main>
</body>
</html>
