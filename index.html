<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Catatan Keuangan Keluarga</title>
  <meta name="description" content="Ringkasan saldo, total masuk dan keluar">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:,">
  <script src="js/auth.js" defer></script>
  <script src="js/keuangan.js" defer></script>
  <script src="js/format.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</head>
<body class="app">
  <aside class="sidebar">
    <p class="sidebar-brand">Keuangan</p>
    <nav class="sidebar-nav">
      <a href="index.html" data-ikon="dashboard" class="nav-aktif">Dashboard</a>
      <a href="transaksi.html" data-ikon="transaksi">Transaksi</a>
      <a href="produk.html" data-ikon="produk">Produk</a>
      <a href="hutang.html" data-ikon="hutang">Hutang</a>
      <a href="profile.html" data-ikon="profile">Profile</a>
    </nav>
  </aside>
  <main class="card">
    <h1>Dashboard</h1>
    <p id="info-user">Loading...</p>
    <hr>
    <p>Total masuk: <strong id="total-masuk">Rp0</strong></p>
    <p>Total keluar: <strong id="total-keluar">Rp0</strong></p>
    <div class="saldo-hero">
      <span class="saldo-label">Saldo</span>
      <strong id="saldo">Rp0</strong>
    </div>
    <div class="field">
      <label for="periode">Periode:</label>
      <select id="periode">
        <option value="semua">Semua Waktu</option>
        <option value="minggu">Minggu Ini</option>
        <option value="bulan">Bulan Ini</option>
      </select>
    </div>
    <hr>
    <h2>Keluar per Kategori</h2>
    <div id="ringkasan-kategori"></div>
</main>
</body>
</html>
