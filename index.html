<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

<body>
  <main class="card">
    <h1>Dashboard</h1>
    <p id="info-user">Loading...</p>
    <hr>
    <p>Total masuk: <strong id="total-masuk">Rp0</strong></p>
    <p>Total keluar: <strong id="total-keluar">Rp0</strong></p>
    <p>Saldo: <strong id="saldo" class="saldo-hero">Rp0</strong></p>
    <div class="field">
      <label for="periode">Periode:</label>
      <select id="periode">
        <option value="semua">Semua Waktu</option>
        <option value="minggu">Minggu Ini</option>
        <option value="bulan">Bulan Ini</option>
      </select>
    </div>
    <hr>
    <h2>Keluar per Kategori</h2>
    <div id="ringkasan-kategori"></div>
