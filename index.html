<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Catatan Keuangan Keluarga</title>
  <meta name="description" content="Ringkasan saldo, total masuk dan keluar">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
  <link rel="icon" href="data:,">
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/keuangan.js" defer></script>
  <script src="js/format.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</head>
<body class="app">
  <aside class="sidebar">
    <p class="sidebar-brand">Keuangan</p>
    <nav class="sidebar-nav">
      <a href="index.html" data-ikon="dashboard" class="nav-aktif">Dashboard</a>
      <a href="transaksi.html" data-ikon="transaksi">Transaksi</a>
      <a href="produk.html" data-ikon="produk">Produk</a>
      <a href="hutang.html" data-ikon="hutang">Hutang</a>
      <a href="profile.html" data-ikon="profile">Profile</a>
    </nav>
  </aside>
  <main class="card">
    <h1>Dashboard</h1>
    <p id="info-user">Loading...</p>
    <hr>
    <div class="stat-duo">
      <div class="stat-card stat-masuk">
        <span class="stat-label">Total masuk</span>
        <strong id="total-masuk">Rp0</strong>
      </div>
      <div class="stat-card stat-keluar">
        <span class="stat-label">Total keluar</span>
        <strong id="total-keluar">Rp0</strong>
      </div>
    </div>
    <div class="saldo-hero">
      <span class="saldo-label">Saldo</span>
      <strong id="saldo">Rp0</strong>
    </div>
    <div class="field">
      <label for="periode">Periode:</label>
      <select id="periode">
        <option value="semua">Semua Waktu</option>
        <option value="minggu">Minggu Ini</option>
        <option value="bulan">Bulan Ini</option>
      </select>
    </div>
    <hr>
    <h2>Keluar per Kategori</h2>
    <div id="ringkasan-kategori"></div>
    <hr>
    <h2>Grafik</h2>
    <div class="grid-grafik">
      <div class="field">
        <canvas id="grafik-arus" height="220" aria-label="Grafik batang pemasukan versus pengeluaran"></canvas>
      </div>
      <div class="field">
        <canvas id="grafik-minggu" height="220" aria-label="Grafik batang pemasukan dan pengeluaran per hari Senin sampai Minggu"></canvas>
      </div>
      <div class="field field-grafik-penuh">
        <canvas id="grafik-kategori" height="220" aria-label="Grafik donat pengeluaran per kategori"></canvas>
      </div>
    </div>
    <p id="info-grafik"></p>
</main>
</body>
</html>
